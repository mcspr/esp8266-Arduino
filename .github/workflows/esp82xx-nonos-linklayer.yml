name: Build and deploy esp82xx-nonos-linklayer


on:
  workflow_dispatch:


permissions:
  actions: write
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare

      - name: Prepare lwip2 builder
        shell: bash
        run: |
          pushd esp8266
          git submodule update --init -- tools/sdk/lwip2/builder
          git submodule update --remote --merge -- tools/sdk/lwip2/builder
          git add -u
          git commit -m 'Update lwip2 builder'
          popd

      - name: Build
        id: build
        shell: bash
        run: |
          pushd esp8266

          pushd tools/sdk/lwip2
          make install
          popd

          if [[ -n $(git diff --exit-code -- tools/sdk/) ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

          popd

      - name: Build and deploy
        if: steps.build.outputs.deploy == 'true'
        shell: bash
        run: |
          pushd esp8266

          pushd tools/sdk/lwip2
          make install
          popd

          git add -u -- tools/sdk/
          git commit -m 'Rebuild lwip2 libs'

          { echo "# git-status after build "; echo '```console'; git --no-pager status ; echo '```'; } \
I             >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          { echo "# git-diff after build "; echo '```diff'; git --no-pager diff ; echo '```'; } \
I             >> $GITHUB_STEP_SUMMARY

          branch=$(date -Im | tr '[:punct:]' '_')
          git push deploy HEAD:lwip2/build-${branch}

          popd
